name: Build Godot Phone (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-phone-android
  cancel-in-progress: true

jobs:
  build-android-editor:
    name: Build full Godot Android editor (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Godot Phone
        uses: actions/checkout@v4
        with:
          path: godot-phone

      - name: Checkout Godot Engine source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot
          submodules: recursive

      - name: Set Godot Phone version
        working-directory: godot/platform/android/java/editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle")
          s = p.read_text()
          s = s.replace("versionCode generateVersionCode()", "versionCode 102")
          s = s.replace("versionName generateVersionName()", 'versionName "1.0.2"')
          s = s.replace('editorAppName: "Godot Engine 4"', 'editorAppName: "Godot Phone"')
          p.write_text(s)
          PY

      - name: Enable Android phone screen support
        working-directory: godot/platform/android/java/editor/src/main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("AndroidManifest.xml")
          s = p.read_text()
          if 'android:smallScreens="false"' not in s:
              raise SystemExit("Expected upstream smallScreens setting was not found")
          s = s.replace('android:smallScreens="false"', 'android:smallScreens="true"')
          s = s.replace('android:screenOrientation="userLandscape"', 'android:screenOrientation="sensorLandscape"')
          pattern = r'(<activity\s+android:name="\.GodotEditor"[^>]*?)(>)'
          def patch_activity(m):
              tag = m.group(1)
              if 'android:resizeableActivity=' not in tag:
                  tag += ' android:resizeableActivity="true"'
              if 'android:windowSoftInputMode=' not in tag:
                  tag += ' android:windowSoftInputMode="adjustResize"'
              return tag + m.group(2)
          s, count = re.subn(pattern, patch_activity, s, count=1, flags=re.S)
          if count != 1 or 'android:resizeableActivity="true"' not in s:
              raise SystemExit("Could not enable resizable Godot editor activity")
          p.write_text(s)
          print("Enabled small-screen support, resizable activity, landscape sensor mode and keyboard resize")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: godot/platform/android/java/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The old "tools" SDK package was removed; v4 installs command-line tools.
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-dev libssl-dev libenet-dev libfreetype-dev libharfbuzz-dev libtheora-dev libvorbis-dev libopus-dev libvulkan-dev yasm nasm
          python3 -m pip install --user --upgrade scons
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Godot Android Swappy dependency
        working-directory: godot
        run: python3 misc/scripts/install_swappy_android.py

      - name: Compile Godot editor native engine for Android ARM64
        working-directory: godot
        run: |
          scons platform=android arch=arm64 production=yes target=editor swappy=yes -j2

      - name: Package complete Android editor APK
        working-directory: godot/platform/android/java
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon generateGodotEditor

      - name: Verify APK integrity, signature and alignment
        run: |
          APK="godot/platform/android/java/editor/build/outputs/apk/android/debug/android_editor-android-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"

      - name: Stage verified APK
        run: |
          APK="godot/platform/android/java/editor/build/outputs/apk/android/debug/android_editor-android-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Godot-Phone-Android-arm64.apk
          sha256sum dist/Godot-Phone-Android-arm64.apk
          ls -lh dist/Godot-Phone-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Phone-Android-arm64
          path: dist/Godot-Phone-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Godot Phone 1.0.2 prerelease
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.2 --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create v1.0.2 --repo "${{ github.repository }}" \
              --title "Godot Phone 1.0.2 — Android ARM64" \
              --notes "Godot Phone 1.0.2. Исправлена поддержка небольших экранов Android, включено изменение размеров окна и корректная работа экранной клавиатуры. Альбомная ориентация редактора. APK проверяется на целостность, подпись и выравнивание. Неофициальный проект." \
              --prerelease
          gh release upload v1.0.2 dist/Godot-Phone-Android-arm64.apk \
            --repo "${{ github.repository }}" --clobber
