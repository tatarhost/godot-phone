plugins { id 'com.android.application' }

android {
    namespace 'fun.neurogenesis'
    compileSdk 35
    defaultConfig {
        applicationId 'fun.neurogenesis'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2 -Wall -Wextra' }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}
